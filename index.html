
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f7ff">
    <meta name="description" content="A simple, clean and productive Todo application.">
    <title>Taskly — My Todo List</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="app">
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon">✓</div>
                <span>taskly<span class="brand-dot">.</span></span>
            </div>
            <span class="date" id="currentDate"></span>
        </header>

        <section class="welcome">
            <p class="eyebrow">YOUR PERSONAL WORKSPACE</p>
            <h1>Make today <span>count.</span></h1>
            <p class="subtitle">Small steps every day lead to big results.</p>
        </section>

        <section class="task-card">
            <div class="task-summary">
                <div>
                    <h2>My tasks</h2>
                    <p id="taskSummary">Let's get things done.</p>
                </div>
                <div class="progress-circle" id="progressCircle">
                    <span id="progressText">0%</span>
                </div>
            </div>

            <form id="taskForm" class="task-form">
                <input
                    id="taskInput"
                    type="text"
                    placeholder="What needs to be done?"
                    maxlength="150"
                    autocomplete="off"
                    required
                    aria-label="New task"
                >
                <button type="submit" class="add-button">+ Add task</button>
            </form>

            <nav class="filters" aria-label="Filter tasks">
                <button type="button" class="filter active" data-filter="all">All</button>
                <button type="button" class="filter" data-filter="active">Active</button>
                <button type="button" class="filter" data-filter="completed">Completed</button>
            </nav>

            <ul id="taskList" class="task-list"></ul>

            <div id="emptyState" class="empty-state">
                <div class="empty-icon">✦</div>
                <h3>Nothing on your list yet</h3>
                <p>Add your first task and get started.</p>
            </div>

            <footer class="task-footer">
                <span id="remainingCount">0 tasks left</span>
                <button id="clearCompleted" type="button" class="clear-button">
                    Clear completed
                </button>
            </footer>
        </section>

        <p class="app-note">A little progress is still progress. ✦</p>
    </main>
</body>
</html>
